<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Papa</title>

    <link rel="stylesheet" href="page4.css">
</head>

<body>

    <div class="birthday-scene">

        <!-- DREAMY PURPLE BACKGROUND -->
        <div class="purple-glow"></div>

        <div class="soft-light light-one"></div>
        <div class="soft-light light-two"></div>
        <div class="soft-light light-three"></div>


        <!-- SUBTLE CONFETTI -->
        <div class="confetti-layer"></div>


        <!-- FAMILY + CAKE -->
        <div class="family-stage">

            <!-- CAKE TABLE -->
            <div class="cake-table">

                <div class="cake">
                    <div class="cake-top"></div>

                    <div class="cake-body">
                        <div class="cake-cream"></div>
                    </div>

                    <div class="cake-candle">
                        <div class="flame"></div>
                    </div>
                </div>

            </div>


            <!-- FAMILY -->
            <div class="family">

                <div class="family-member papa">
                    <img
                        src="BackgroundEraser_20261007_103851196.png"
                        alt="Papa"
                    >
                </div>

                <div class="family-member mummy">
                    <img
                        src="BackgroundEraser_20261007_103635102.png"
                        alt="Mummy"
                    >
                </div>

                <div class="family-member didi">
                    <img
                        src="BackgroundEraser_20261007_103651794.png"
                        alt="Didi"
                    >
                </div>

                <div class="family-member you">
                    <img
                        src="BackgroundEraser_20261007_103034752.png"
                        alt="You"
                    >
                </div>

            </div>

        </div>


        <!-- BIRTHDAY MESSAGE -->
        <div class="birthday-message">

            <div class="message-sparkle sparkle-one">✦</div>
            <div class="message-sparkle sparkle-two">✧</div>
            <div class="message-sparkle sparkle-three">✦</div>

            <h1>Happy Birthday Papa...!! 💐</h1>

        </div>


        <!-- SYSTEM MESSAGE -->
        <div class="mission-screen">

            <div class="mission-box">

                <div class="system-title">
                    SYSTEM MESSAGE
                </div>

                <div class="mission-main">
                    BALLOON INVASION DETECTED
                </div>

                <div class="mission-text">
                    MISSION: POP THE BALLOONS
                </div>

                <div class="ready-text">
                    READY?
                </div>

                <div class="countdown">
                    3
                </div>

            </div>

        </div>


        <!-- BALLOONS -->
        <div class="balloon-layer"></div>


        <!-- POP EFFECTS -->
        <div class="pop-layer"></div>

    </div>


    <script src="page4.js"></script>

</body>
</html>
