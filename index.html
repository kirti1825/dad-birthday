<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Pitashree 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Night sky -->
    <div class="stars"></div>

    <!-- Moon -->
    <div class="moon">
        <div class="moon-shadow"></div>
    </div>

    <!-- Decorative sparkles -->
    <div class="sparkle sparkle-1">✦</div>
    <div class="sparkle sparkle-2">✧</div>
    <div class="sparkle sparkle-3">✦</div>
    <div class="sparkle sparkle-4">✧</div>

    <!-- Main card -->
    <main class="welcome-card">

        <!-- Birthday emoji -->
        <div class="birthday-emoji">
            🎂
        </div>

        <!-- Main heading -->
        <h1>
            <span class="welcome-word">WELCOME</span>
            <span class="pitashree-word">PITASHREE</span>
        </h1>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Message -->
        <p class="message">
            Unfortunately, you've been given access to
            a website made by your daughter.
        </p>

        <p class="skip-warning">
            There is no skip. 💀
        </p>

        <p class="risk-warning">
            Interact at your own risk.
        </p>

        <!-- Button -->
        <button id="enterButton">
            ENTER AT YOUR OWN RISK
            <span>→</span>
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
