<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Boy 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>
    <div class="sparkles"></div>

    <main class="welcome-card">

        <div class="small-star star-one">✦</div>
        <div class="small-star star-two">✧</div>
        <div class="small-star star-three">✦</div>

        <p class="tiny-text">A VERY IMPORTANT ANNOUNCEMENT</p>

        <h1>
            WELCOME,<br>
            <span>BIRTHDAY BOY 🎂</span>
        </h1>

        <div class="divider"></div>

        <p class="warning-text">
            Unfortunately, you have been given access to a website
            made by your daughter.
        </p>

        <p class="danger-text">
            There is no skip.
        </p>

        <p class="risk-text">
            Interact at your own risk. ⚠️
        </p>

        <button id="enterButton">
            ENTER AT YOUR OWN RISK
            <span>→</span>
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
