<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meet My Pitashree</title>

    <link rel="stylesheet" href="page2.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NIGHT SKY -->

    <div class="night-sky">

        <div class="stars"></div>
        <div class="stars stars-two"></div>

        <div class="moon"></div>

    </div>


    <!-- PAGE -->

    <main class="pitashree-page">

        <!-- HEADING -->

        <header class="page-heading">

            <div class="tiny-sparkles">
                ✦　✧　✦
            </div>

            <p class="meet-text">
                Meet My
            </p>

            <h1 class="pitashree-title">
                PITASHREE
                <span class="cool-emoji">😎</span>
            </h1>

            <div class="golden-line"></div>

        </header>


        <!-- PROFILE -->

        <section class="profile-area">


            <!-- FATHER -->

            <div class="character-side">

                <div class="character-glow"></div>

                <div class="sparkle sparkle-one">✦</div>
                <div class="sparkle sparkle-two">✧</div>
                <div class="sparkle sparkle-three">✦</div>

                <img
                    src="BackgroundEraser_20261007_103851196.png"
                    alt="Pitashree"
                    class="father-character"
                >

                <div class="character-shadow"></div>

            </div>


            <!-- INFORMATION -->

            <div class="information-side">


                <!-- NAME -->

                <div class="name-block">

                    <h2>
                        MANOJ KUMAR MISHRA
                    </h2>

                    <div class="name-line"></div>

                    <p class="dob-label">
                        DOB
                    </p>

                    <p class="dob-date">
                        09 OCTOBER
                    </p>

                </div>


                <!-- ROLE -->

                <div class="reveal-card role-card">

                    <button class="reveal-button">

                        <span class="topic-icon">
                            🏠
                        </span>

                        <span class="topic-title">
                            ROLE IN THE FAMILY
                        </span>

                        <span class="tap-symbol">
                            ✧
                        </span>

                    </button>

                    <div class="reveal-content">

                        <p>
                            The problem solver — whenever something happens,
                            you're the first person we call or tell.
                        </p>

                    </div>

                </div>


                <!-- SPECIAL ABILITY -->

                <div class="reveal-card ability-card">

                    <button class="reveal-button">

                        <span class="topic-icon">
                            🕵️
                        </span>

                        <span class="topic-title">
                            SPECIAL ABILITY
                        </span>

                        <span class="tap-symbol">
                            ✧
                        </span>

                    </button>

                    <div class="reveal-content">

                        <p>
                            Detecting suspicious activities from three rooms away
                            <span class="laugh">
                                😂
                            </span>
                        </p>

                    </div>

                </div>


                <!-- FAVOURITE THING -->

                <div class="reveal-card chai-card">

                    <button class="reveal-button">

                        <span class="topic-icon">
                            ☕
                        </span>

                        <span class="topic-title">
                            FAVOURITE THING
                        </span>

                        <span class="tap-symbol">
                            ✧
                        </span>

                    </button>

                    <div class="reveal-content">

                        <p class="chai-main">
                            CHAI.
                        </p>

                        <p class="chai-small">
                            Anytime. Anywhere.
                        </p>

                    </div>

                </div>


            </div>

        </section>


        <!-- BOTTOM DECORATION -->

        <div class="bottom-sparkles">
            ✦　·　✧　·　✦　·　✧　·　✦
        </div>

    </main>


    <script src="page2.js"></script>

</body>

</html>
