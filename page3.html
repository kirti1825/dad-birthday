<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Little Adventure</title>

    <link rel="stylesheet" href="page3.css">
</head>

<body>

    <div class="scene">

        <!-- NIGHT ATMOSPHERE -->
        <div class="sky"></div>

        <!-- STARS -->
        <div class="stars stars-one"></div>
        <div class="stars stars-two"></div>
        <div class="stars stars-three"></div>

        <!-- SOFT GLOW -->
        <div class="ambient-glow"></div>

        <!-- FLOATING PARTICLES -->
        <div class="particles"></div>

        <!-- ANCIENT GATE -->
        <div class="gate-area">

            <div class="gate-glow"></div>

            <div class="gate">

                <div class="gate-top">
                    <div class="gate-symbol">✦</div>
                </div>

                <div class="gate-frame">

                    <div class="gate-door left-door"></div>
                    <div class="gate-door right-door"></div>

                    <div class="inside-light"></div>

                </div>

                <div class="gate-ground-glow"></div>

            </div>

        </div>

        <!-- FATHER -->
        <div class="father-walker">

            <img
                src="BackgroundEraser_20261007_104347177.png"
                alt="Father walking toward the gate"
            >

        </div>

        <!-- KNOCK EFFECT -->
        <div class="knock-effect">
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
        </div>

        <!-- LITTLE TEXT -->
        <div class="scene-text">

            <p class="little-line">
                Somewhere beyond the stars...
            </p>

            <h1>
                THERE'S A LITTLE SURPRISE
            </h1>

        </div>

        <!-- FINAL LIGHT -->
        <div class="final-light"></div>

    </div>

    <script src="page3.js"></script>

</body>
</html>
