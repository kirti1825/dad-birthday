<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Little Surprise</title>

    <link rel="stylesheet" href="page3.css">
</head>

<body>

    <div class="scene">

        <!-- NIGHT SKY -->
        <div class="sky"></div>

        <!-- MOON -->
        <div class="moon"></div>

        <!-- STARS -->
        <div class="stars stars-one"></div>
        <div class="stars stars-two"></div>
        <div class="stars stars-three"></div>

        <!-- SOFT NIGHT GLOW -->
        <div class="night-glow"></div>

        <!-- LITTLE TEXT -->
        <div class="scene-text">
            THERE'S A LITTLE SURPRISE
        </div>

        <!-- WOODEN GATE -->
        <div class="gate-area">

            <div class="gate">

                <div class="gate-arch">
                    <div class="gate-detail">✦</div>
                </div>

                <div class="gate-frame">

                    <div class="door left-door">
                        <div class="wood-lines"></div>
                        <div class="door-handle"></div>
                    </div>

                    <div class="door right-door">
                        <div class="wood-lines"></div>
                        <div class="door-handle"></div>
                    </div>

                </div>

            </div>

        </div>

        <!-- PAPA -->
        <div class="father-walker">

            <img
                src="BackgroundEraser_20261007_104347177.png"
                alt="Papa"
            >

        </div>

        <!-- KNOCK EFFECT -->
        <div class="knock">
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
        </div>

    </div>

    <script src="page3.js"></script>

</body>
</html>
